<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>แก้ไขโปรไฟล์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h3 class="text-center mb-4">แก้ไขโปรไฟล์</h3>

            <!-- แสดงข้อความแจ้งเตือน -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <!-- รูปโปรไฟล์ -->
            <div class="text-center my-4">
            {% if request.user.profile.avatar %}
                <img src="{{ request.user.profile.avatar.url }}" class="rounded-circle" width="170" height="170" alt="Avatar">
            {% else %}
                <img src="/media/avatars/default-avatar.png" class="rounded-circle" width="170" height="170" alt="Default Avatar">
            {% endif %}
            </div>

            <!-- ฟอร์มอัปเดต -->
            <form method="POST" enctype="multipart/form-data" class="border p-4 rounded bg-white shadow-sm">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">บันทึกการเปลี่ยนแปลง</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">กลับไปแดชบอร์ด</a>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
