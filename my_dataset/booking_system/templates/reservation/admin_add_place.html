{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>เพิ่มสถานที่ใหม่</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h3 class="mb-4">เพิ่มสถานที่ใหม่</h3>

    <form method="POST" enctype="multipart/form-data" class="bg-white p-4 shadow-sm rounded">
        {% csrf_token %}

        {% for field in form %}
            {% if field.name != "image" %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <small class="form-text text-muted">{{ field.help_text }}</small>
                {% endif %}
            </div>
            {% endif %}
        {% endfor %}

         <div class="mb-3">
            <label class="form-label">อัปโหลดรูปภาพเพิ่มเติม (เลือกได้หลายรูป):</label>
            <input type="file" name="images" multiple class="form-control">
        </div>
        
        <button type="submit" class="btn btn-success">บันทึก</button>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">ยกเลิก</a>
    </form>
</div>

</body>
</html>
