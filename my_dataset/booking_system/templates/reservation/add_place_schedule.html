
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>เพิ่มวัน/เวลาให้สถานที่</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h3>เพิ่มวัน/เวลาให้สถานที่</h3>

   <form method="POST">
  {% csrf_token %}
  <div class="mb-3">
    <label>สถานที่</label>
    {{ form.place }}
  </div>
  <div class="mb-3">
    <label>วันที่</label>
    {{ form.date }}
  </div>
  <div class="mb-3">
    <label>เวลาเริ่มต้น</label>
    {{ form.start_time }}
  </div>
  <div class="mb-3">
    <label>เวลาสิ้นสุด</label>
    {{ form.end_time }}
  </div>

  <button type="submit" class="btn btn-success">บันทึก</button>
  <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">กลับ</a>
</form>

</div>
</body>
</html>
