{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>อัปเดตสถานที่</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h3>อัปเดตข้อมูลสถานที่: {{ place.name }}</h3>

    <form method="POST" enctype="multipart/form-data" class="bg-white p-4 shadow rounded">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">ชื่อสถานที่</label>
            <input type="text" name="name" class="form-control" value="{{ place.name }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">รายละเอียด</label>
            <textarea name="description" class="form-control" rows="3">{{ place.description }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">ความจุ (จำนวนคน)</label>
            <input type="number" name="capacity" class="form-control" value="{{ place.capacity }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">รูปภาพ (อัปโหลดใหม่หากต้องการเปลี่ยน)</label>
            {% if place.image %}
                <img src="{{ place.image.url }}" width="150" class="d-block mb-2">
            {% endif %}
            <input type="file" name="image" class="form-control">
        </div>

        <button type="submit" class="btn btn-success">บันทึกการแก้ไข</button>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">ยกเลิก</a>
    </form>
</div>

</body>
</html>
